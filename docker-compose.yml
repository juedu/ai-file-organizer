services:
  ai-file-organizer:
    build: .
    container_name: ai-file-organizer
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_MODE=remote
